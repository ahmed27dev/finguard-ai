# Shared configuration — do not fork this into two versions.
# If you need a new setting, add it here and tell the other person.

paths:
  raw_data_dir: 'data/raw'
  processed_data_dir: 'data/processed'
  finqa_train: 'data/raw/FinQA/dataset/train.json'
  finqa_dev: 'data/raw/FinQA/dataset/dev.json'
  finqa_test: 'data/raw/FinQA/dataset/test.json'
  faiss_index_path: 'data/processed/faiss_index.bin'

models:
  bi_encoder: 'sentence-transformers/all-MiniLM-L6-v2'
  cross_encoder: 'cross-encoder/ms-marco-MiniLM-L-6-v2'
  generator: 'google/flan-t5-base'
  nli_model: 'roberta-large-mnli'

retrieval:
  bi_encoder_top_k: 20
  cross_encoder_top_k: 5
  chunk_size_tokens: 300
  chunk_overlap_tokens: 50

anomaly_detection:
  yoy_change_threshold_pct: 20
  tracked_metrics:
    - 'revenue'
    - 'net_income'
    - 'total_debt'
    - 'operating_margin'
    - 'cash_flow'

faithfulness:
  min_faithfulness_score: 0.6
